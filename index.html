<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chai Pe Charcha · YPG India</title>
  <style>
    :root {
      --blue: #0166FF;
      --blue-dark: #0B43A5;
      --ink: #152238;
      --muted: #667085;
      --bg: #F6F8FC;
      --white: #FFFFFF;
      --border: #E2E7EE;
      --soft-blue: #EEF5FF;
      --soft-gold: #FFF8EA;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .screen {
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 58% 42%;
      background: var(--white);
    }

    .left,
    .right {
      min-width: 0;
      min-height: 0;
    }

    /* LEFT */

    .left {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 6.5vh 4.2vw;
      background: var(--white);
      border-right: 1px solid var(--border);
    }

    .eyebrow {
      margin: 0 0 clamp(14px, 2vh, 24px);
      color: var(--blue);
      font-size: clamp(15px, min(1.15vw, 2.3vh), 22px);
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      line-height: 1.25;
      white-space: nowrap;
    }

    .title {
      margin: 0;
      font-size: clamp(60px, min(5.85vw, 11.5vh), 112px);
      line-height: 0.98;
      font-weight: 750;
      letter-spacing: -0.055em;
      color: var(--ink);
      white-space: nowrap;
    }

    .title span {
      color: var(--blue);
    }

    .speaker {
      margin: clamp(22px, 3vh, 36px) 0 0;
      color: var(--ink);
      font-size: clamp(18px, min(1.5vw, 3vh), 28px);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.3;
      white-space: nowrap;
    }

    .speaker strong {
      font-weight: 650;
    }

    .role {
      margin: clamp(6px, 0.9vh, 12px) 0 0;
      color: var(--muted);
      font-size: clamp(14px, min(1.05vw, 2.1vh), 20px);
      font-weight: 500;
      letter-spacing: -0.011em;
      line-height: 1.35;
      white-space: nowrap;
    }

    .event-meta {
      margin-top: clamp(20px, 3vh, 36px);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta {
      padding: 10px 15px;
      border: 1px solid #DCE8FA;
      border-radius: 999px;
      background: var(--soft-blue);
      color: #174EA6;
      font-size: clamp(15px, min(1.12vw, 2.2vh), 20px);
      font-weight: 650;
      line-height: 1.2;
      white-space: nowrap;
    }

    /* RIGHT */

    .right {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 42%,
          #FFFDF8 0%,
          #FFF8EA 56%,
          #FFF1D6 100%
        );
    }

    .image-frame {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6vh 1.4vw 2.8vh;
    }

    .mark {
      display: block;
      width: 100%;
      height: 100%;
    }

    .corner-label {
      position: absolute;
      z-index: 2;
      top: 22px;
      right: 24px;
      padding: 9px 14px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: #8A5A16;
      font-size: clamp(11px, min(0.75vw, 1.5vh), 15px);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.2;
      white-space: nowrap;
      backdrop-filter: blur(10px);
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .screen {
        width: 100%;
        height: auto;
        min-height: 100vh;
        overflow: visible;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
      }

      .left {
        padding: 36px 28px 32px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .eyebrow,
      .title,
      .speaker,
      .role {
        white-space: normal;
      }

      .title {
        font-size: clamp(42px, 12vw, 72px);
      }

      .right {
        min-height: 52vh;
      }

      .image-frame {
        padding: 56px 24px 28px;
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <section class="left">
      <div class="eyebrow">YPG India presents · Chai Pe Charcha #1</div>

      <h1 class="title">
        Don&rsquo;t put a new<br>
        <span>engine</span><br>
        in an old factory.
      </h1>

      <div class="speaker">
        A leadership talk over chai with <strong>Anudeep Muttavarapu</strong>
      </div>

      <div class="role">Country Head &amp; MD, India · Senior Director, CPS</div>

      <div class="event-meta">
        <div class="meta">Wednesday, November 18</div>
        <div class="meta">3:30 – 4:30 PM</div>
        <div class="meta">9th Floor, MFAR Building</div>
      </div>
    </section>

    <section class="right">
      <div class="corner-label">Leadership Talk Series</div>

      <div class="image-frame">
        <svg class="mark" viewBox="0 0 640 900" role="img" aria-labelledby="markTitle" preserveAspectRatio="xMidYMid meet">
          <title id="markTitle">A clay chai cup whose steam curls into a gear</title>
          <defs>

              <stop offset="28%" stop-color="#E59A66"/>
              <stop offset="62%" stop-color="#D47842"/>
              <stop offset="100%" stop-color="#B2582B"/>
            </linearGradient>
            <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#F8D8BE"/>
              <stop offset="48%" stop-color="#E7A06C"/>
              <stop offset="100%" stop-color="#C56B3A"/>
            </linearGradient>
            <radialGradient id="tea" cx="38%" cy="32%" r="72%">
              <stop offset="0%" stop-color="#F8E7C6"/>
              <stop offset="34%" stop-color="#E0A15A"/>
              <stop offset="100%" stop-color="#8A4C22"/>
            </radialGradient>
            <linearGradient id="gearFill" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4B93FF"/>
              <stop offset="46%" stop-color="#0166FF"/>
              <stop offset="100%" stop-color="#0B43A5"/>
            </linearGradient>
            <linearGradient id="steam" gradientUnits="userSpaceOnUse" x1="320" y1="590" x2="320" y2="340">
              <stop offset="0%" stop-color="#D6E6FF" stop-opacity="0"/>
              <stop offset="16%" stop-color="#C5DAFF" stop-opacity="0.95"/>
              <stop offset="58%" stop-color="#6EA2FF"/>
              <stop offset="100%" stop-color="#0166FF"/>
            </linearGradient>
            <linearGradient id="steamCore" gradientUnits="userSpaceOnUse" x1="320" y1="585" x2="320" y2="370">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
              <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.95"/>
              <stop offset="62%" stop-color="#FFFFFF" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
            </linearGradient>
          </defs>

          <circle cx="320" cy="230" r="228" fill="#0166FF" opacity="0.04"/>
          <circle cx="320" cy="680" r="150" fill="#FFFFFF" opacity="0.3"/>

          <ellipse cx="320" cy="828" rx="118" ry="15" fill="#8A5A16" opacity="0.07"/>
          <ellipse cx="320" cy="818" rx="96" ry="11" fill="#634316" opacity="0.14"/>

          <path fill="url(#clay)" d="M176 568 C166 632 192 724 240 762 C266 784 292 796 320 798 C348 796 374 784 400 762 C448 724 474 632 464 568 Z"/>
          <path d="M214 676 Q320 694 426 676" fill="none" stroke="#7A3816" stroke-opacity="0.2" stroke-width="3" stroke-linecap="round"/>
          <path d="M208 612 C196 668 214 730 248 766" fill="none" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="9" stroke-linecap="round"/>

          <ellipse cx="320" cy="568" rx="146" ry="32" fill="url(#rim)"/>
          <ellipse cx="320" cy="574" rx="122" ry="23" fill="#7A4120"/>
          <ellipse cx="320" cy="578" rx="112" ry="18" fill="url(#tea)"/>
          <ellipse cx="286" cy="572" rx="36" ry="7" fill="#FFFFFF" opacity="0.34"/>

          <g fill="none" stroke-linecap="round">
            <path d="M286 572 C210 518 198 466 262 426" stroke="url(#steam)" stroke-width="15"/>
            <path d="M358 570 C444 522 450 470 386 430" stroke="url(#steam)" stroke-width="13"/>
            <path d="M318 574 C228 512 246 448 332 406 C404 372 370 346 326 358" stroke="url(#steam)" stroke-width="26"/>
            <path d="M318 574 C228 512 246 448 332 406 C404 372 370 346 326 358" stroke="url(#steamCore)" stroke-width="8"/>
          </g>

          <g transform="translate(320 228) scale(1.16) translate(-320 -228)">
            <path
              fill="url(#gearFill)"
              stroke="url(#gearFill)"
              stroke-width="5"
              stroke-linejoin="round"
              fill-rule="evenodd"
              d="M 295.63 133.08 L 301.90 93.21 L 338.10 93.21 L 344.37 133.08 L 369.89 143.65 L 402.51 119.89 L 428.11 145.49 L 404.35 178.11 L 414.92 203.63 L 454.79 209.90 L 454.79 246.10 L 414.92 252.37 L 404.35 277.89 L 428.11 310.51 L 402.51 336.11 L 369.89 312.35 L 344.37 322.92 L 338.10 362.79 L 301.90 362.79 L 295.63 322.92 L 270.11 312.35 L 237.49 336.11 L 211.89 310.51 L 235.65 277.89 L 225.08 252.37 L 185.21 246.10 L 185.21 209.90 L 225.08 203.63 L 235.65 178.11 L 211.89 145.49 L 237.49 119.89 L 270.11 143.65 Z M 330.73 170.72 a 13.00 13.00 0 1 0 26.00 0 a 13.00 13.00 0 1 0 -26.00 0 Z M 364.28 251.73 a 13.00 13.00 0 1 0 26.00 0 a 13.00 13.00 0 1 0 -26.00 0 Z M 283.27 285.28 a 13.00 13.00 0 1 0 26.00 0 a 13.00 13.00 0 1 0 -26.00 0 Z M 249.72 204.27 a 13.00 13.00 0 1 0 26.00 0 a 13.00 13.00 0 1 0 -26.00 0 Z"
            />
            <circle cx="320" cy="228" r="86" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2.5"/>
            <circle cx="320" cy="228" r="28" fill="#083E8C"/>
            <circle cx="320" cy="228" r="10" fill="#FFFFFF"/>
          </g>
        </svg>
      </div>
    </section>
  </main>
</body>
</html>
